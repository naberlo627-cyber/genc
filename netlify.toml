# Netlify yapılandırması.
# Depo kökü olduğu gibi yayınlanır; derleme adımı yoktur (saf statik site).

[build]
  publish = "."
  command = ""

# Uygulama sayfası ve veri her zaman taze; simgeler uzun süre önbellekte kalır.
[[headers]]
  for = "/Genc.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/events.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
