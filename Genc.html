<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E9E1FA">
<title>Genç</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236D4AFF'/%3E%3Cstop offset='1' stop-color='%23FF4F8B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Genç">
<meta name="application-name" content="Genç">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17112E;--on-ink:#FFFFFF;--paper:#E9E1FA;--card:#FFFFFF;
  --brand:#5B3DF5;--on-brand:#FFFFFF;--sun:#FFC83D;--coral:#FF5A5F;--coral-text:#D92D4A;--mute:#625E7C;--line:#D5CBF0;--sw-off:#8F82B8;
  --grad:linear-gradient(135deg,#6D4AFF 0%,#5B3DF5 100%);
  --logo-c1:#6D4AFF;--logo-c2:#B44DE0;--logo-c3:#FF4F8B;--logo-fg:#FFFFFF;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F2EEFF;--on-ink:#140D2E;--paper:#120C26;--card:#2A2048;
  --brand:#9A85FF;--on-brand:#140D2E;--sun:#FFC83D;--coral:#FF7A7F;--coral-text:#FF9AA0;--mute:#A9A0CE;--line:#453872;--sw-off:#7E6FBD;
  --grad:linear-gradient(135deg,#6D4AFF 0%,#5B3DF5 100%);
  --logo-c1:#A78BFF;--logo-c2:#C77DFF;--logo-c3:#FF7AB0;--logo-fg:#140D2E;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#F2EEFF;--on-ink:#140D2E;--paper:#120C26;--card:#2A2048;
  --brand:#9A85FF;--on-brand:#140D2E;--sun:#FFC83D;--coral:#FF7A7F;--coral-text:#FF9AA0;--mute:#A9A0CE;--line:#453872;--sw-off:#7E6FBD;
  --grad:linear-gradient(135deg,#6D4AFF 0%,#5B3DF5 100%);
  --logo-c1:#A78BFF;--logo-c2:#C77DFF;--logo-c3:#FF7AB0;--logo-fg:#140D2E;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35;color:var(--ink);background:var(--paper);overflow:hidden;transition:background-color .2s}
body.night{background:#150E2E}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.dark-ui :focus-visible,.night :focus-visible{outline-color:var(--sun)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.f{fill:currentColor}
.disp{font-stretch:75%;font-weight:800;line-height:1.02;letter-spacing:-.005em}

/* ---------- uygulama kabuğu ---------- */
#app{position:fixed;inset:0;margin:0 auto;max-width:480px;width:100%;background:var(--paper);overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}

/* ---------- ortak ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:28px 20px 12px}
.loc{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;padding:6px 8px 6px 0;border-radius:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.search{margin:0 20px;height:50px;border-radius:15px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--mute)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--mute);opacity:1}
.search:focus-within{box-shadow:0 0 0 3px var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 12px}
.sec h2{font-size:25px}
.sec a,.sec button{color:var(--brand);font-weight:700;font-size:14px;text-decoration:none;padding:6px 0}

.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,34,0) 45%,rgba(8,12,34,.78) 100%)}

.nav{height:86px;background:var(--card);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px 22px;border-top:1px solid var(--line);flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:12px;color:var(--mute)}
.nav .ico{width:58px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .15s}
.nav .on{color:var(--ink)}
.nav .on .ico{background:var(--sun);color:#17112E}
.nav.night{background:#150E2E;border-top:0}
.nav.night button{color:#C9C1EA}
.nav.night .on{color:#fff}
.nav.night .on .ico{background:var(--sun);color:#17112E}

/* ---------- kayıt ---------- */
.steps{display:flex;gap:6px;flex:1;margin-left:14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.d{background:var(--brand)}
.back{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.ob-title{font-size:38px;padding:18px 20px 8px}
.ob-sub{padding:0 20px;color:var(--mute);max-width:34ch}
.locrow{margin:20px 20px 4px;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.locrow .t{flex:1;font-weight:700}
.locrow .t small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--sw-off);position:relative;transition:background-color .15s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.picks{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px}
.pick{height:46px;padding:0 18px;border-radius:23px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:background-color .15s,color .15s}
.pick svg{width:18px;height:18px;display:none}
.pick[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}
.pick[aria-pressed="true"] svg{display:block}
.cta{margin:8px 20px 28px;height:54px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;text-align:center;display:block;width:calc(100% - 40px);transition:opacity .15s}
.cta[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- bilet satırı ---------- */
.tk{display:flex;background:var(--card);border-radius:16px;position:relative;margin:0 20px 12px;width:calc(100% - 40px);text-align:left}
.tk::before,.tk::after{content:"";position:absolute;left:62px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.tk::before{top:-10px}
.tk::after{bottom:-10px}
.tk .stub{width:72px;flex:none;padding:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px dashed var(--line);gap:0}
.tk .stub b{font-stretch:75%;font-weight:800;font-size:32px;line-height:1}
.tk .stub span{font-size:13px;font-weight:600;color:var(--mute)}
.tk .info{flex:1;padding:14px 14px 14px 16px;min-width:0}
.tk .info strong{display:block;font-size:16px;line-height:1.2;margin-bottom:3px}
.tk .info .v{color:var(--mute);font-size:13.5px}
.tk .info .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.dist{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.dist svg{width:15px;height:15px}
.price{font-weight:800;font-size:15px}
.stub.hot{background:var(--sun);border-radius:16px 0 0 16px}
.stub.hot span,.stub.hot b{color:#17112E}

/* ---------- afişler ---------- */
.hrail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.hrail::-webkit-scrollbar{display:none}
.poster{flex:none;width:150px}
.poster .pic{position:relative;height:214px;border-radius:16px;overflow:hidden;display:block}
.poster .tag{position:absolute;left:8px;top:8px;background:rgba(23,17,46,.82);color:#fff;font-size:12px;font-weight:700;padding:4px 9px 4px 6px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
.poster .tag svg{width:13px;height:13px}
.poster strong{display:block;margin-top:9px;font-size:15px;line-height:1.2}
.poster span.m{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.thumb{flex:none;width:104px;height:170px;border-radius:14px;position:relative;overflow:hidden;display:block}
.thumb em{position:absolute;left:9px;right:9px;bottom:9px;color:#fff;font-style:normal;font-weight:700;font-size:13px;line-height:1.2;display:flex;align-items:flex-end;gap:5px}
.thumb em svg{width:14px;height:14px;flex:none;margin-bottom:1px}

/* ---------- kısa videolar ---------- */
.vid{flex:1;position:relative;overflow:hidden;color:#fff}
.vtop{position:absolute;left:0;right:0;top:0;padding:28px 20px 46px;background:linear-gradient(180deg,rgba(6,8,24,.78),rgba(6,8,24,0))}
.vtabs{display:flex;gap:22px;justify-content:center}
.vtabs button{font-weight:700;font-size:17px;padding:6px 2px 8px;color:#D5DAF0;border-bottom:3px solid transparent}
.vtabs button[aria-pressed="true"]{color:#fff;border-color:var(--sun)}
.reach{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.reach div{font-size:12px;color:#DDE1F4;font-weight:600}
.reach div::before{content:"";display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.32);margin-bottom:5px}
.reach div.now{color:#fff;font-weight:800}
.reach div.now::before{background:var(--sun)}
.vscrim{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(180deg,rgba(6,8,24,0),rgba(6,8,24,.86))}
.vinfo{position:absolute;left:20px;right:96px;bottom:26px}
.vchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:5px 11px 5px 8px;border-radius:14px;font-size:13px;font-weight:600}
.vchip svg{width:15px;height:15px}
.vinfo h2{font-size:42px;margin:12px 0 8px}
.vinfo .when{font-weight:700;font-size:16px}
.vinfo .where{font-size:15px;color:#E7EAF8}
.vinfo .src{font-size:12.5px;color:#D5DAF0;margin-top:12px}
.vact{position:absolute;right:14px;bottom:28px;display:flex;flex-direction:column;align-items:center;gap:16px}
.vact button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;text-align:center}
.vact .c{width:54px;height:54px;border-radius:50%;background:rgba(8,12,34,.55);display:grid;place-items:center;transition:background-color .15s,color .15s,transform .15s}
.vact .c svg{width:27px;height:27px}
.vact button[aria-pressed="true"] .c{background:#fff}
.vact .like[aria-pressed="true"] .c{color:var(--coral)}
.vact .like[aria-pressed="true"] .c svg{fill:var(--coral)}
.vact .save[aria-pressed="true"] .c{color:#17112E}
.vact .save[aria-pressed="true"] .c svg{fill:var(--sun)}
.vact .buy .c{width:62px;height:62px;background:var(--sun);color:#17112E}
.vact .buy .c svg{width:32px;height:32px;stroke-width:2.4}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28)}
.vprog i{display:block;height:100%;width:34%;background:var(--card)}
.toast{position:absolute;left:20px;right:20px;top:118px;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:none}
.toast svg{color:var(--brand)}



/* ---------- profil ---------- */
.ph{display:flex;align-items:center;gap:14px;padding:28px 20px 8px}
.ph .big{width:68px;height:68px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none}
.ph h1{font-size:30px}
.ph .dist{margin-top:4px}
.ph .ed{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.likes{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.likes span{height:36px;padding:0 15px;border-radius:18px;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.likes span.o{background:var(--card);color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.grid3 .thumb{width:100%;height:146px}
.att{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;margin:0 20px 10px;padding:10px;width:calc(100% - 40px)}
.att .mini-art{width:46px;height:58px;border-radius:10px;position:relative;overflow:hidden;flex:none}
.att strong{display:block;font-size:15px;line-height:1.2}
.att span{color:var(--mute);font-size:13px}
.att .done{margin-left:auto;display:inline-flex;gap:4px;align-items:center;color:var(--mute);font-size:13px;font-weight:600;flex:none}
.att .done svg{width:16px;height:16px;color:var(--brand)}
.cardrow{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;margin:0 20px 10px;padding:12px 14px;width:calc(100% - 40px)}
.cardrow .plastic{width:56px;height:38px;border-radius:8px;background:var(--brand);position:relative;flex:none}
.cardrow .plastic::after{content:"";position:absolute;left:7px;top:9px;width:11px;height:8px;border-radius:2px;background:var(--sun)}
.cardrow strong{display:block;font-size:15px}
.cardrow span{color:var(--mute);font-size:13px}
.cardrow .def{margin-left:auto;font-size:12px;font-weight:700;background:var(--paper);padding:4px 9px;border-radius:10px}
.acc{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;margin:0 20px 10px;padding:14px;width:calc(100% - 40px)}
.acc small{display:block;color:var(--mute);font-size:12.5px}
.acc b{font-size:15px}
.acc svg{color:var(--mute)}
.pad{height:24px}


/* ---------- Genç: yeni renkler ve düzen ---------- */
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 6px}
.brandlogo{width:104px;height:auto;display:block}
.logobtn{display:block;padding:0;border-radius:12px;-webkit-tap-highlight-color:transparent}
.logobtn:active{transform:scale(.97)}
.logobtn:active .brandlogo{opacity:.85}
.logo-lg{width:150px;height:auto;display:block;margin:calc(env(safe-area-inset-top,0px) + 8px) 20px 0}
.avatar,.ph .big{background:var(--grad)}
.avatar{border:0}
.locbar{padding:0 20px 12px}
.loc{padding:4px 8px 4px 0}
.cta{background:var(--grad);box-shadow:0 12px 24px -14px rgba(91,61,245,.8)}
.cta[disabled]{box-shadow:none}
.cardrow .plastic{background:var(--grad)}
.nav{height:auto;min-height:86px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.nav .on .ico{background:var(--sun);color:#17112E}
.back{box-shadow:0 0 0 1px var(--line)}
.sw[aria-checked="true"]{background:var(--brand)}
.thumb,.poster .pic,.tk,.search,.chip{transition:transform .12s}
.poster:active .pic,.tk:active,.thumb:active{transform:scale(.98)}
.empty{margin:0 20px 8px;padding:18px;border-radius:16px;background:var(--card);color:var(--mute);text-align:center;font-size:14px}
.sec .more{color:var(--brand);font-weight:700;font-size:14px;padding:6px 0}
.hint{padding:0 20px;color:var(--mute);font-size:13px;margin-top:8px}

/* formlar */
.field{margin:14px 20px 0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:15px;border:0;background:var(--card);padding:0 14px;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.field input:focus{outline:0;box-shadow:0 0 0 3px var(--brand)}
.field .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{margin:10px 20px 0;color:#D32F4D;font-weight:600;font-size:14px;min-height:20px}
.sh-body .err{margin:10px 0 0}
.fin{padding:0 20px}
.cta.sm{margin:12px 0 0;width:100%}

/* hazır ekranı */
.done-logo{width:190px;height:auto;margin:34px auto 8px;display:block}
.done-chips{justify-content:center;padding:14px 20px 0}

/* alt sayfa (sheet) */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(23,17,46,.55);opacity:0;transition:opacity .2s}
.ov.open{opacity:1}
.sheet{width:100%;max-width:480px;max-height:90%;background:var(--paper);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(28px);transition:transform .22s}
.ov.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;gap:12px}
.sh-head h3{font-size:26px}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line)}
.sh-body{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sh-body .field{margin:12px 0 0}
.sh-body .picks{padding:6px 0 4px}
.sh-body .cta{margin:14px 0 0;width:100%}
.opt-row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt-row[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--brand)}
.opt-row .ic{color:var(--brand)}
.opt-row small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.opt-row .tick{margin-left:auto;display:none}
.opt-row[aria-pressed="true"] .tick{display:block}

/* etkinlik ayrıntısı */
.dhero{position:relative;height:190px;border-radius:20px;overflow:hidden}
.dhero .poster-tag{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.dhero .poster-tag span{background:rgba(23,17,46,.82);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
.dhero .poster-tag svg{width:13px;height:13px}
.dtitle{font-size:32px;margin:16px 0 8px}
.dline{display:flex;gap:8px;align-items:center;color:var(--mute);font-weight:600;font-size:15px;margin-top:5px}
.dline svg{width:18px;height:18px;color:var(--brand)}
.dprice{display:flex;align-items:baseline;gap:10px;margin:16px 0 0}
.dprice b{font-stretch:75%;font-weight:800;font-size:34px;line-height:1}
.dprice small{color:var(--mute);font-size:13px}
.dacts{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:54px;border-radius:16px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.iconbtn{flex:none;width:54px;height:54px;border-radius:16px;background:var(--card);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.iconbtn[aria-pressed="true"]{background:var(--sun);box-shadow:none;color:#17112E}
.iconbtn[aria-pressed="true"] svg{fill:#17112E}

/* uygulama içi satıcı sayfası */
.webv{position:fixed;inset:0;margin:0 auto;max-width:480px;width:100%;z-index:60;background:var(--paper);display:flex;flex-direction:column}
.whead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.whead .ti{flex:1;min-width:0}
.whead strong{display:block;font-size:16px}
.whead small{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12.5px}
.whead small svg{width:14px;height:14px;color:#1F9D61}
.wbody{flex:1;overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.wtitle{font-size:30px;margin:16px 0 4px}
.wsub{color:var(--mute);font-weight:600;margin-bottom:16px}
.wrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;font-weight:700}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:24px;font-weight:700;text-align:center;line-height:1}
.qty output{min-width:20px;text-align:center;font-weight:800;font-size:18px}
.wtot b{font-stretch:75%;font-weight:800;font-size:34px}
.wbody .btn{width:100%;margin-top:12px}
.wnote{display:flex;gap:10px;color:var(--mute);font-size:13px;margin-top:14px}
.wnote svg{width:18px;height:18px;color:var(--brand);margin-top:1px}
.wdone{text-align:center;padding:40px 10px}
.wdone .ok{width:72px;height:72px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 18px}
.wdone .ok svg{width:36px;height:36px;stroke-width:2.6}
.wdone h2{font-size:30px;margin-bottom:8px}
.wdone p{color:var(--mute);margin-bottom:20px}
.wdone .bigqr{max-width:230px;margin:0 auto}

/* ---------- biletlerim ---------- */
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 20px 4px}
.actgrid button{display:flex;align-items:center;gap:10px;padding:15px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:left}
.actgrid svg{width:20px;height:20px;color:var(--brand);flex:none}
.installrow{display:flex;align-items:center;gap:12px;margin:8px 20px;padding:14px;border-radius:16px;background:var(--grad);color:#fff}
.installrow>svg{width:24px;height:24px;flex:none}
.installrow span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.installrow strong{font-size:14px}
.installrow small{font-size:12px;opacity:.85}
.installrow button{background:#fff;color:#17112E;border:0;border-radius:11px;padding:9px 16px;font-weight:800;font-size:13px}
.tkt{position:relative;margin:14px 20px 0;border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.tkt .top2{display:flex;gap:12px;align-items:flex-start;padding:16px}
.tkt .mini-art{position:relative;width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.tkt .top2>span:nth-child(2){display:flex;flex-direction:column;gap:3px}
.tkt .top2 strong{font-size:16px;font-stretch:82%}
.tkt .top2 .m{font-size:13px;color:var(--mute)}
.tkt .top2 .o{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.tkt .top2 .o svg{width:14px;height:14px;flex:none}
.tkt .code{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.tkt .code small{font-size:9px;letter-spacing:.08em;color:var(--mute);font-weight:700}
.tkt .code b{font-size:15px;letter-spacing:.05em;font-stretch:75%}
.tkt .stub2{display:flex;gap:14px;align-items:center;padding:14px 16px 16px;border-top:1px dashed var(--line)}
.tkt .qr{width:88px;height:88px;flex:none;background:#fff;border-radius:10px;padding:5px;display:block}
.tkt .qr svg,.bigqr svg{width:100%;height:100%;display:block}
.tkt .st{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute);min-width:0}
.tkt .st b{font-size:14px;color:var(--ink)}
.tkt .st .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tkt .st .acts button{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:11px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ink)}
.tkt .st .acts svg{width:14px;height:14px;color:var(--brand)}
.bigqr{width:100%;max-width:260px;aspect-ratio:1;margin:14px auto;background:#fff;border-radius:16px;padding:10px}

/* ---------- dosya yükleme ---------- */
.up{margin:2px 0 12px;padding:26px 16px;border-radius:18px;border:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:border-color .15s,background-color .15s}
.up.over{border-color:var(--brand);background:var(--paper)}
.upic{width:32px;height:32px;color:var(--brand)}
.up strong{font-size:15px}
.up small{font-size:12px;color:var(--mute)}
.up input{margin-top:8px;font-size:13px;max-width:100%}
.uplist{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.uplist li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--paper);font-size:13px}
.uplist .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uplist .us{flex:none;color:var(--mute);font-weight:700}
.uplist .up-ok .us{color:#1E9E63}
.uplist .up-err .us{color:var(--coral-text)}
.sh-body .err{color:var(--coral-text);font-size:13px;font-weight:600;padding:0 0 4px}

/* videolar */
.feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#0B0820;color:#fff}
.feed::-webkit-scrollbar{display:none}
.vid{height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff;flex:none}
.vtop{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 46px;background:linear-gradient(180deg,rgba(6,8,24,.78),rgba(6,8,24,0));pointer-events:none}
.vtop button{pointer-events:auto}
.vbrand{pointer-events:auto;margin:0 0 12px}
.vbrand .brandlogo{width:96px}
.vinfo{position:absolute;left:20px;right:96px;bottom:26px}
.vinfo h2{font-size:40px}
.vprog i{width:0}
.vprog i.play{animation:prog 10s linear forwards}
.feed.paused .vprog i.play{animation-play-state:paused}
@keyframes prog{from{width:0}to{width:100%}}
.pausemark{position:absolute;left:50%;top:44%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(8,12,34,.6);display:grid;place-items:center;opacity:0;transition:opacity .15s;pointer-events:none;color:#fff}
.pausemark svg{width:38px;height:38px;stroke-width:2.6}
.feed.paused .pausemark{opacity:1}
.vend{background:linear-gradient(180deg,#1B1147,#3B1D7A 60%,#7A2A8E);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.vend h2{font-size:38px}
.vend p{color:#E4DFF6;max-width:30ch}
.vend .btn{flex:none;width:100%;max-width:300px;background:var(--sun);color:#17112E}
.vend .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.toast{position:fixed;left:50%;right:auto;top:calc(env(safe-area-inset-top,0px) + 14px);width:min(440px,calc(100% - 40px));z-index:90;transform:translate(-50%,-10px)}
.toast.show{transform:translate(-50%,0)}

/* profil */
.cardrow{padding:8px 8px 8px 14px}
.cardrow .cmain{display:flex;gap:14px;align-items:center;flex:1;min-width:0;text-align:left}
.cardrow .cdel{width:40px;height:40px;display:grid;place-items:center;color:var(--mute);flex:none;border-radius:50%}
.cardrow .def{margin-left:auto}
.cardrow .cmain .txt{min-width:0}
.cardrow .cmain .txt span{display:block}
.setdef{font-size:12px;font-weight:700;color:var(--brand);background:none;padding:4px 0;margin-left:auto}
.logout{display:block;width:calc(100% - 40px);margin:6px 20px 0;padding:14px;text-align:center;font-weight:700;color:var(--coral-text);border-radius:16px;background:var(--card)}
.sec button.more{color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.vprog i.play{animation-duration:.01s}}

.wide{flex:none;width:300px;height:176px;border-radius:20px;position:relative;overflow:hidden;display:block}
.wide.sm{width:250px;height:150px}
.wide .wb{position:absolute;left:12px;top:12px;background:rgba(23,17,46,.82);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
.wide .wt{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.wide .wt strong{display:block;font-stretch:75%;font-weight:800;font-size:25px;line-height:1.05}
.wide .wt span{display:block;font-size:13px;margin-top:4px;color:#F1EEFF}
.wide:active{transform:scale(.98)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.cat{border-radius:16px;min-height:78px;padding:11px 12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.cat:active{transform:scale(.97)}
.cat b{font-size:14px;line-height:1.15}
.cat small{font-size:12px;opacity:.9}
.venue{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;margin:0 20px 10px;padding:12px 14px;width:calc(100% - 40px)}
.venue>.ic:first-child{color:var(--brand)}
.venue span{flex:1;min-width:0}
.venue strong{display:block;font-size:15px}
.venue small{color:var(--mute);font-size:13px}
.venue>.ic:last-child{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 20px 0}
.stats div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.stats b{display:block;font-stretch:75%;font-weight:800;font-size:28px;line-height:1}
.stats small{color:var(--mute);font-size:12.5px}

.themeseg{margin:0 20px 10px;background:var(--card);border-radius:16px;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.themeseg button{height:42px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;color:var(--mute);transition:background-color .15s,color .15s}
.themeseg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}

/* ---------- biletlerim ---------- */
.tkt{display:flex;background:var(--card);border-radius:20px;position:relative;margin:0 20px 14px;width:calc(100% - 40px);text-align:left;overflow:hidden;box-shadow:0 12px 26px -20px rgba(23,17,46,.55)}
.tkt .top2{display:flex;gap:14px;padding:14px;align-items:center}
.tkt .mini-art{width:64px;height:80px;border-radius:12px;position:relative;overflow:hidden;flex:none}
.tkt .top2 strong{display:block;font-size:17px;line-height:1.2}
.tkt .top2 .m{color:var(--mute);font-size:13px;margin-top:3px}
.tkt .top2 .o{color:var(--mute);font-size:12.5px;margin-top:6px;display:flex;align-items:center;gap:5px}
.tkt .top2 .o svg{width:15px;height:15px}
.tkt .code{flex:1;text-align:right}
.tkt .code small{display:block;color:var(--mute);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.tkt .code b{font-stretch:75%;font-weight:800;font-size:22px;letter-spacing:.04em}
.tkt .stub2{border-top:2px dashed var(--line);padding:12px 14px 16px;display:flex;align-items:center;gap:12px}
.tkt .stub2 .qr{width:78px;height:78px;border-radius:12px;background:var(--paper);flex:none;padding:7px}
.tkt .stub2 .qr svg{width:100%;height:100%;display:block}
.tkt .stub2 .st{flex:1;min-width:0}
.tkt .stub2 .st b{display:block;font-size:14.5px}
.tkt .stub2 .st span{color:var(--mute);font-size:12.5px;display:block;margin-top:2px}
.tkt .acts{display:flex;gap:8px;margin-top:10px}
.tkt .acts button{height:40px;padding:0 14px;border-radius:12px;background:var(--paper);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.tkt .acts button svg{width:17px;height:17px}
.tkt .used{position:absolute;right:14px;top:14px;background:var(--sun);color:#17112E;font-weight:800;font-size:12px;padding:4px 10px;border-radius:10px}
.tkt.past{opacity:.72}
.bigqr{background:#fff;border-radius:20px;padding:18px;margin:14px auto 6px;width:min(260px,70vw)}
.bigqr svg{width:100%;height:auto;display:block}
.actgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 20px 0}
.actgrid button{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.actgrid button svg{width:20px;height:20px;color:var(--brand)}
.installrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;margin:0 20px 10px;padding:14px;width:calc(100% - 40px);box-shadow:inset 0 0 0 1.5px var(--line)}
.installrow .ic{color:var(--brand);flex:none}
.installrow span{flex:1;min-width:0}
.installrow strong{display:block;font-size:15px}
.installrow small{color:var(--mute);font-size:12.5px}
.installrow button{background:var(--grad);color:#fff;font-weight:700;font-size:13.5px;padding:10px 14px;border-radius:12px;flex:none}
@media (max-width:380px){.nav button{font-size:10.5px}}

<script>
/* Genç - küçük QR kod üretici (bayt kipi, sürüm 1-5, L/M/Q/H). */
(function (root) {
  var EXP = new Array(512), LOG = new Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }
  function polyMul(a, b) {
    var r = new Array(a.length + b.length - 1);
    for (var i = 0; i < r.length; i++) r[i] = 0;
    for (i = 0; i < a.length; i++) for (var j = 0; j < b.length; j++) r[i + j] ^= mul(a[i], b[j]);
    return r;
  }
  function rsGen(n) { var p = [1]; for (var i = 0; i < n; i++) p = polyMul(p, [1, EXP[i]]); return p; }
  function rsEncode(data, nec) {
    var gen = rsGen(nec), res = data.concat(new Array(nec));
    for (var i = 0; i < res.length; i++) res[i] = res[i] || 0;
    for (i = 0; i < data.length; i++) {
      var coef = res[i];
      if (coef) for (var j = 0; j < gen.length; j++) res[i + j] ^= mul(gen[j], coef);
    }
    return res.slice(data.length);
  }

  var EC_BITS = { L: 1, M: 0, Q: 3, H: 2 };
  var RS = {
    1: { L: [[1, 26, 19]], M: [[1, 26, 16]], Q: [[1, 26, 13]], H: [[1, 26, 9]] },
    2: { L: [[1, 44, 34]], M: [[1, 44, 28]], Q: [[1, 44, 22]], H: [[1, 44, 16]] },
    3: { L: [[1, 70, 55]], M: [[1, 70, 44]], Q: [[2, 35, 17]], H: [[2, 35, 13]] },
    4: { L: [[1, 100, 80]], M: [[2, 50, 32]], Q: [[2, 50, 24]], H: [[4, 25, 9]] },
    5: { L: [[1, 134, 108]], M: [[2, 67, 43]], Q: [[2, 33, 15], [2, 34, 16]], H: [[2, 33, 11], [2, 34, 12]] }
  };
  var ALIGN = { 1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30] };
  var FORMAT_EC = { L: 1, M: 0, Q: 3, H: 2 };

  function utf8Bytes(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c < 0xdc00) {
        var c2 = s.charCodeAt(++i);
        c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  function dataCodewords(version, level) {
    var g = RS[version][level], n = 0;
    for (var i = 0; i < g.length; i++) n += g[i][0] * g[i][2];
    return n;
  }

  function pickVersion(len, level) {
    for (var v = 1; v <= 5; v++) {
      if (4 + 8 + len * 8 <= dataCodewords(v, level) * 8) return v;
    }
    return 0;
  }

  function encode(text, level) {
    var bytes = utf8Bytes(text);
    var version = pickVersion(bytes.length, level);
    if (!version) throw new Error("QR: veri bu sürüme sığmıyor");
    var cap = dataCodewords(version, level);
    var bits = [];
    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    put(4, 4);
    put(bytes.length, 8);

/* Konum cihazdan alınır; il/ilçe seçtirmeyiz. */
function geoAsk(cb){
  if(!navigator.geolocation){toast('Bu tarayıcı konumu desteklemiyor.');if(cb)cb(false);return}
  toast('Konumun alınıyor…');
  navigator.geolocation.getCurrentPosition(function(p){
    S.loc={d:'Konumum',lat:p.coords.latitude,lng:p.coords.longitude,geo:true};
    S.locOn=true;persist();paintObLoc();renderKesfet();
    if(S.tab==='profil')renderProfile();
    if(!$('#main').hidden&&S.tab==='videolar')renderFeed();
    toast('Konumun kullanılıyor.');
    if(cb)cb(true);
  },function(err){
    toast(err&&err.code===1?'Konum izni verilmedi.':'Konum alınamadı. Tekrar dene.');
    if(cb)cb(false);
  },{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}
function locLabel(){return S.loc.geo?'Konumum':S.loc.d}
function distLabel(e){var k=kmTo(e);return (e.district===S.loc.d||k<1)?e.district+(k>=1?', '+Math.round(k)+' km':''):Math.round(k)+' km'}
function chipDist(e){var k=Math.round(kmTo(e));return e.district+', '+(k<1?'çok yakın':k+' km')}
function priceLabel(e){
  var p=e.prices.map(function(x){return x[1]}),m=Math.min.apply(null,p),M=Math.max.apply(null,p);
  return m===M?fmt(m):fmt(m).replace(' ₺','')+' ₺’den';
}
function initials(n){
  var w=String(n||'').trim().split(/\s+/).filter(Boolean);
  if(!w.length)return 'G';
  return ((w[0][0]||'')+(w.length>1?w[w.length-1][0]:'')).toLocaleUpperCase('tr-TR');
}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}

/* ---------- bildirim ---------- */
var toastT;
function toast(m){
  $('#toast-t').textContent=m;var t=$('#toast');t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2600);
}

/* ---------- geri tuşu / geçmiş yönetimi ---------- */
/* Her açılan katman (sekme, alt sayfa, satıcı sayfası) geçmişe yazılır.
   Geri tuşu önce katmanları kapatır; kök seviyede uygulamadan çıkar. */
var histStack=[],expectPop=0;
function layerPush(l){histStack.push(l);try{history.pushState({d:histStack.length},'')}catch(e){}}
function hideLayer(l){
  if(l.t==='sheet')hideSheet();
  else if(l.t==='web')hideWeb();
}
function closeTopLayer(type){
  var top=histStack[histStack.length-1];
  if(!top||(type&&top.t!==type))return;
  histStack.pop();expectPop++;
  try{history.back()}catch(e){}
}
window.addEventListener('popstate',function(ev){
  if(expectPop>0){expectPop--;return}
  var want=(ev.state&&ev.state.d)||0;
  while(histStack.length>want)hideLayer(histStack.pop());
});

/* ---------- alt sayfa ---------- */
var lastFocus=null,sheetT;
function openSheet(title,body,mount){
  lastFocus=document.activeElement;
  $('#sh-title').textContent=title;$('#sh-body').innerHTML=body;
  var ov=$('#sheet');clearTimeout(sheetT);ov.hidden=false;
  requestAnimationFrame(function(){ov.classList.add('open')});
  if(mount)mount($('#sh-body'));
  $('#sh-close').focus();
  if(!histStack.length||histStack[histStack.length-1].t!=='sheet')layerPush({t:'sheet'});
}
function hideSheet(){
  var ov=$('#sheet');ov.classList.remove('open');
  sheetT=setTimeout(function(){ov.hidden=true},200);
  if(lastFocus&&document.body.contains(lastFocus)&&lastFocus.focus)lastFocus.focus();
}
function closeSheet(){closeTopLayer('sheet');hideSheet();}
$('#sh-close').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',function(e){if(e.target===this)closeSheet()});

/* ---------- kayıt ---------- */
var step=1;
function showStep(n){
  step=n;
  $$('.ostep').forEach(function(s,i){s.hidden=(i+1!==n)});
  $$('#steps i').forEach(function(d,i){d.classList.toggle('d',i<n)});
  $('#steps').setAttribute('aria-label','Adım '+n+' / 3');
  $('#ob-back').style.visibility=n>1?'visible':'hidden';
  if(n===2){paintObLoc();countPicks()}
  if(n===3){
    var f=firstName(S.name);
    $('#done-title').textContent=f?'Hazırsın, '+f+'!':'Hazırsın!';
    $('#done-sub').textContent=S.likes.length+' ilgi alanına göre öneriler hazırlandı. Beğendikçe kendini düzeltir.';
    $('#done-likes').innerHTML=S.likes.map(function(l){return '<span>'+esc(l)+'</span>'}).join('');
  }
}
function paintObLoc(){
  $('#ob-locname').textContent=S.locOn?(S.loc.geo?'Konumun kullanılıyor':'Konum kapalı'):'Konum kapalı';
  $('#ob-locsub').textContent=S.locOn?(S.loc.geo?'Yakınındakileri önce göstereceğiz':'Konumunu kullanmak için dokun'):'Yakınındakileri görmek için konumunu aç';
  $('#ob-sw').setAttribute('aria-checked',S.locOn?'true':'false');
}
function countPicks(){
  var n=selectedPicks($('#picks')).length,b=$('#pickgo');
  b.textContent=n?'Devam et, '+n+' seçili':'En az bir tür seç';b.disabled=!n;
}
$('#picks').innerHTML=pickHTML(S.likes);
$('#picks').addEventListener('click',function(e){
  var p=e.target.closest('[data-pick]');if(!p)return;
  p.setAttribute('aria-pressed',p.getAttribute('aria-pressed')==='true'?'false':'true');countPicks();
});
$('#ob-sw').addEventListener('click',function(){
  if(S.locOn){S.locOn=false;persist();paintObLoc();return}
  geoAsk(function(ok){if(!ok){S.locOn=false;paintObLoc()}});
});
$('#ob-back').addEventListener('click',function(){if(step>1)showStep(step-1)});

/* ---------- tema (sistem / açık / koyu) ---------- */
var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function isDark(){return S.theme==='dark'||(S.theme==='system'&&mq&&mq.matches)}
function paintChrome(){
  var c=(S.tab==='videolar'&&!$('#main').hidden)?'#150E2E':(isDark()?'#120C26':'#E9E1FA');
  document.querySelector('meta[name=theme-color]').setAttribute('content',c);
}
function applyTheme(){
  var r=document.documentElement;
  if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
  paintChrome();
}

function goHome(){
  closeTopLayer('sheet');hideSheet();
  closeTopLayer('web');hideWeb();

function setTab(t,fromHistory){
  S.tab=t;
  ['kesfet','videolar','biletler','profil'].forEach(function(x){$('#tab-'+x).hidden=(x!==t)});
  $$('#nav button').forEach(function(b){
    var on=b.getAttribute('data-tab')===t;
    b.classList.toggle('on',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  var night=(t==='videolar');
  $('#nav').classList.toggle('night',night);document.body.classList.toggle('night',night);
  $('#main').classList.toggle('dark-ui',night);
  paintChrome();
  if(t==='videolar'){renderFeed();}
  else{$('#feed').classList.add('paused');}
  if(t==='biletler')renderTickets();
  if(t==='profil')renderProfile();
}

}
function setChip(c){S.filter=c;$$('#chips .chip').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-chip')===c?'true':'false')})}
function matches(e){
  if(S.filter!=='Tümü'&&e.type!==S.filter)return false;
  var q=norm(S.q).trim();if(!q)return true;
  var hay=norm([e.title,e.venue,e.district,e.type].join(' '));
  return hay.indexOf(q)>-1||q.indexOf(norm(e.type))>-1;
}
function secHead(t,more){return '<div class="sec"><h2 class="disp">'+t+'</h2>'+(more||'')+'</div>'}
function posterHTML(e){
  return '<button class="poster" type="button" data-open="'+e.id+'"><span class="pic"><svg class="art" aria-hidden="true"><use href="#'+e.art+'"/></svg>'+

  return '<button class="wide '+(cls||'')+'" type="button" data-open="'+e.id+'"><svg class="art" aria-hidden="true"><use href="#'+e.art+'"/></svg><span class="scrim"></span><span class="wb">'+esc(e.type)+'</span><span class="wt"><strong>'+esc(e.title)+'</strong><span>'+esc(e.short.replace(/^Bugün 4 seans, /,'Bugün, '))+' · '+esc(priceLabel(e))+'</span></span></button>';
}

  return '<button class="tk" type="button" data-open="'+e.id+'"><span class="stub'+(e.hot?' hot':'')+'"><span>'+esc(e.wd)+'</span><b>'+e.day+'</b><span>'+e.mon+'</span></span>'+

function thumbHTML(e){
  return '<button class="thumb" type="button" data-vid="'+e.id+'"><svg class="art" aria-hidden="true"><use href="#'+e.art+'"/></svg><span class="scrim"></span><em>'+ic('play','f')+esc(e.vlabel)+'</em></button>';
}
function renderKesfet(){
  $('#locname').textContent=S.locOn?locLabel():'Konum kapalı';
  $$('.ini').forEach(function(x){x.textContent=initials(S.name)});
  var browsing=!S.q.trim()&&S.filter==='Tümü';
  var list=EVENTS.filter(matches).sort(function(a,b){return kmTo(a)-kmTo(b)});
  var byDate=list.slice().sort(function(a,b){return a.date<b.date?-1:1});
  var h='';
  if(!list.length){
    h+=secHead('Sonuçlar')+'<div class="empty">“'+esc(S.q||S.filter)+'” için sonuç bulunamadı. Başka bir arama dene.</div>';
    $('#klists').innerHTML=h;return;
  }
  if(browsing){
    var feat=EVENTS.filter(function(e){return e.feat});
    h+=secHead('Öne çıkanlar')+'<div class="hrail">'+feat.map(function(e){return wideHTML(e)}).join('')+'</div>';
    h+=secHead('Türe göre')+'<div class="cats">'+CHIPS.slice(1).map(function(t){
      var n=EVENTS.filter(function(e){return e.type===t}).length,c=(CATC[t]||'#6D4AFF,#FF4F8B').split(',');
      return '<button class="cat" type="button" data-cat="'+esc(t)+'" style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')"><b>'+esc(t)+'</b><small>'+n+' etkinlik</small></button>';
    }).join('')+'</div>';
  }
  h+=secHead(browsing?'Çevrende yapılacak gösteriler':'Sonuçlar')+'<div class="hrail">'+list.map(posterHTML).join('')+'</div>';
  var week=byDate.filter(function(e){return e.date<='2026-11-22'});
  var shown=(browsing&&!S.showAll)?week:byDate;
  var more=(browsing&&byDate.length>week.length)?'<button class="more" type="button" id="moreBtn">'+(S.showAll?'Daha az':'Tümü ('+byDate.length+')')+'</button>':'';
  h+=secHead(browsing?(S.showAll?'Yaklaşanlar':'Bu hafta'):'Tarihe göre',more)+shown.map(tkHTML).join('');
  var vids=list.filter(function(e){return e.video});
  h+=secHead('Kısa videolar','<button class="more" type="button" data-tab="videolar">Hepsini izle</button>');
  h+=vids.length?'<div class="hrail">'+vids.map(thumbHTML).join('')+'</div>':'<div class="empty">Bu aramada video yok. Etkinlikleri yukarıdan açabilirsin.</div>';
  if(browsing){
    var tours=EVENTS.filter(function(e){return e.type==='Gezi turu'});
    h+=secHead('Gezi turları')+'<div class="hrail">'+tours.map(function(e){return wideHTML(e,'sm')}).join('')+'</div>';
    var free=EVENTS.filter(function(e){return e.prices.every(function(p){return p[1]===0})});
    h+=secHead('Ücretsiz etkinlikler')+'<div class="hrail">'+free.map(posterHTML).join('')+'</div>';
    var vm={};EVENTS.forEach(function(e){(vm[e.venue]=vm[e.venue]||{e:e,n:0}).n++});
    var vs=Object.keys(vm).map(function(k){return vm[k]}).sort(function(a,b){return kmTo(a.e)-kmTo(b.e)}).slice(0,6);
    h+=secHead('Yakındaki mekanlar')+vs.map(function(v){
      return '<button class="venue" type="button" data-venue="'+esc(v.e.venue)+'">'+ic('pin')+'<span><strong>'+esc(v.e.venue)+'</strong><small>'+esc(distLabel(v.e))+' · '+v.n+' etkinlik</small></span>'+ic('chev-r')+'</button>';
    }).join('');
  }
  $('#klists').innerHTML=h;
}

      '<button class="btn ghost" type="button" data-act="back" style="margin-top:10px">Kapat</button></div>';

  if(a&&a.getAttribute('data-act')==='back')closeWeb();
});

/* ---------- videolar ---------- */
var io=null,active=-1;
function videoList(){
  var v=EVENTS.filter(function(e){return e.video});
  if(S.vtab==='yakin')return v.sort(function(a,b){return kmTo(a)-kmTo(b)});
  var boost={};Object.keys(S.liked).forEach(function(id){if(S.liked[id]){var t=ALL[id].type;boost[t]=(boost[t]||0)+1}});
  function sc(e){return (S.likes.indexOf(e.type)>-1?50:0)+(boost[e.type]||0)*20-kmTo(e)}
  return v.sort(function(a,b){return sc(b)-sc(a)});
}
function region(e){return (e.district===S.loc.d||(S.loc.geo&&kmTo(e)<10))?0:1}
function renderReach(i,list){
  var r=(list[i]?region(list[i]):3),L=[S.locOn?locLabel():'Çevren','İzmir','Ege','Türkiye'];
  $('#reach').innerHTML=L.map(function(n,k){return '<div'+(k===r?' class="now"':'')+'>'+esc(n)+'</div>'}).join('');
  $('#reach').setAttribute('aria-label','Önce '+(S.locOn?locLabel():'çevren')+', sonra İzmir, Ege ve Türkiye');
}
function renderFeed(startId){
  var feed=$('#feed'),list=videoList();
  feed.classList.remove('paused');
  feed.innerHTML=list.map(function(e){
    return '<article class="vid" data-id="'+e.id+'"><svg class="art" aria-hidden="true"><use href="#'+e.art+'"/></svg><div class="vscrim"></div>'+
     '<div class="pausemark">'+ic('pause')+'</div>'+
     '<div class="vinfo"><span class="vchip">'+ic('pin')+esc(chipDist(e))+'</span><h2 class="disp">'+esc(e.vtitle)+'</h2><div class="when">'+esc(e.when)+'</div><div class="where">'+esc(e.venue)+', biletler '+esc(priceLabel(e))+'</div><div class="src">'+esc(e.src)+'</div></div>'+
     '<div class="vact">'+
       '<button class="like tog" type="button" data-act="like" aria-pressed="'+!!S.liked[e.id]+'"><span class="c">'+ic('heart')+'</span>Beğen</button>'+
       '<button class="save tog" type="button" data-act="save" aria-pressed="'+!!S.saved[e.id]+'"><span class="c">'+ic('bookmark')+'</span>Kaydet</button>'+
       '<button type="button" data-act="share"><span class="c">'+ic('share')+'</span>Paylaş</button>'+
       '<button class="buy" type="button" data-act="buy"><span class="c">'+ic('plus')+'</span>Bilet al</button>'+
     '</div><div class="vprog"><i></i></div></article>';
  }).join('')+
  '<article class="vid vend"><h2 class="disp">Şimdilik hepsi bu</h2><p>Videosu olmayan etkinliklerin biletleri de uygulamada. Keşfet’te hepsine göz at.</p><button class="btn" type="button" data-tab="kesfet">Keşfet’e dön</button><button class="btn ghost" type="button" data-act="restart">Baştan izle</button></article>';
  if(io)io.disconnect();
  active=-1;
  io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting&&en.intersectionRatio>=.6){
        var items=$$('.vid',feed),i=items.indexOf(en.target);
        if(i!==active)activate(i,items,list);
      }
    });
  },{root:feed,threshold:[.6]});
  $$('.vid',feed).forEach(function(v){io.observe(v)});
  var idx=0;
  if(startId){idx=Math.max(0,list.map(function(e){return e.id}).indexOf(startId))}
  feed.scrollTop=idx*feed.clientHeight;
  $$('#vtabs button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-vtab')===S.vtab?'true':'false')});
  renderReach(idx,list);
}
function activate(i,items,list){
  active=i;
  $$('.vprog i',$('#feed')).forEach(function(b){b.classList.remove('play');b.style.width=''});
  renderReach(i,list);
  var bar=$('.vprog i',items[i]);
  if(bar){void bar.offsetWidth;bar.classList.add('play')}
}
$('#feed').addEventListener('animationend',function(ev){
  if(reduce||!ev.target.matches('.vprog i'))return;
  var cur=ev.target.closest('.vid'),nx=cur&&cur.nextElementSibling;
  if(nx)$('#feed').scrollTo({top:nx.offsetTop,behavior:'smooth'});
});
$('#feed').addEventListener('click',function(ev){
  if(ev.target.closest('button'))return;
  this.classList.toggle('paused');
});
$('#vtabs').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-vtab]');if(!b)return;
  S.vtab=b.getAttribute('data-vtab');renderFeed();
});

/* ---------- dosya yükleme ---------- */
function uploadSheet(){
  openSheet('Dosya yükle','<div class="up" id="up-zone"><svg class="upic"><use href="#i-install"/></svg>'+
    '<strong>Dosya seç veya sürükle</strong><small>Belge, bilet görseli, ödeme dekontu… (en fazla 10 MB)</small>'+
    '<input id="up-file" type="file" multiple aria-label="Yüklenecek dosyalar"></div>'+
    '<ul class="uplist" id="up-list"></ul><p class="err" id="up-err" role="alert"></p>',
  function(root){
    var input=$('#up-file',root),zone=$('#up-zone',root);
    input.addEventListener('change',function(){upSend(input.files)});
    ['dragenter','dragover'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.add('over')})});
    ['dragleave','drop'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();zone.classList.remove('over')})});
    zone.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files.length)upSend(e.dataTransfer.files)});
  });
}
function upRow(name,state){
  var li=document.createElement('li');li.className='up-'+state;
  li.innerHTML='<span class="un"></span><span class="us"></span>';
  $('.un',li).textContent=name;
  $('.us',li).textContent=state==='ok'?'yüklendi':state==='err'?'hata':'yükleniyor…';
  $('#up-list').appendChild(li);return li;
}
function upSend(files){
  if(!files||!files.length)return;
  var er=$('#up-err');er.textContent='';
  Array.prototype.forEach.call(files,function(f){
    if(f.size>10*1024*1024){er.textContent='“'+f.name+'” 10 MB sınırını aşıyor.';upRow(f.name,'err');return}
    var row=upRow(f.name,'wait'),fd=new FormData();fd.append('file',f,f.name);
    fetch('upload',{method:'POST',body:fd}).then(function(r){
      if(!r.ok)throw 0;
      row.className='up-ok';$('.us',row).textContent='yüklendi';
    }).catch(function(){
      row.className='up-err';$('.us',row).textContent='hata';
      er.textContent='Sunucuya ulaşılamadı. Dosya yüklenemedi.';
    });
  });
}

function addCard(){
  openSheet('Kart ekle',
   '<div class="field"><label for="k-no">Kart numarası</label><input id="k-no" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000" maxlength="23"></div>'+
   '<div class="field"><div class="two"><div><label for="k-exp">Son kullanma</label><input id="k-exp" type="text" inputmode="numeric" autocomplete="cc-exp" placeholder="AA/YY" maxlength="5"></div><div><label for="k-cvv">Güvenlik kodu</label><input id="k-cvv" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4"></div></div></div>'+
   '<p class="hint" style="padding:0">Bu taslakta kart bilgisi saklanmaz; yalnızca son 4 hane gösterilir.</p>'+
   '<p class="err" id="k-err" role="alert"></p><button class="cta" type="button" data-act="savecard">Kartı kaydet</button>',function(root){
    $('#k-no',root).addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,19);this.value=d.replace(/(.{4})/g,'$1 ').trim()});
    $('#k-exp',root).addEventListener('input',function(){var d=this.value.replace(/\D/g,'').slice(0,4);this.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d});
    $('#k-cvv',root).addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,4)});
  });
}
function saveCard(){
  var d=$('#k-no').value.replace(/\D/g,''),ex=$('#k-exp').value,cv=$('#k-cvv').value,er=$('#k-err');
  if(d.length<13){er.textContent='Kart numarası eksik görünüyor.';$('#k-no').focus();return}
  var m=/^(\d{2})\/(\d{2})$/.exec(ex);
  if(!m||+m[1]<1||+m[1]>12){er.textContent='Son kullanma tarihini AA/YY yaz.';$('#k-exp').focus();return}
  var now=new Date(),y=now.getFullYear()%100,mo=now.getMonth()+1;
  if(+m[2]<y||(+m[2]===y&&+m[1]<mo)){er.textContent='Bu kartın süresi dolmuş.';$('#k-exp').focus();return}
  if(cv.length<3){er.textContent='Güvenlik kodu 3 veya 4 hane olmalı.';$('#k-cvv').focus();return}
  S.cards.forEach(function(c){c.def=false});
  S.cards.push({id:'c'+Date.now(),last4:d.slice(-4),exp:ex,def:true});persist();
  closeSheet();renderProfile();toast('Kart eklendi ve varsayılan yapıldı.');
}

function share(e){
  var data={title:e.title,text:e.title+' · '+e.when+' · '+e.venue,url:location.href};
  if(navigator.share){navigator.share(data).catch(function(){});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(data.text).then(function(){toast('Etkinlik bilgisi panoya kopyalandı.')},function(){toast('Kopyalanamadı. Bilgiyi elle paylaşabilirsin.')});
  }else toast('Bu tarayıcıda paylaşım desteklenmiyor.');
}
document.addEventListener('click',function(ev){
  var t=ev.target;
  if(t.closest('#moreBtn')){S.showAll=!S.showAll;renderKesfet();return}
  var cat=t.closest('[data-cat]');
  if(cat){setChip(cat.getAttribute('data-cat'));S.q='';$('#q').value='';renderKesfet();$('#kscroll').scrollTop=0;return}
  var ven=t.closest('[data-venue]');
  if(ven){S.q=ven.getAttribute('data-venue');$('#q').value=S.q;setChip('Tümü');renderKesfet();$('#kscroll').scrollTop=0;return}
  if(t.closest('[data-act="geoloc"]')){geoAsk(function(ok){if(ok)closeSheet()});return}
  var tab=t.closest('[data-tab]');
  if(tab){setTab(tab.getAttribute('data-tab'));return}
  var vid=t.closest('[data-vid]');
  if(vid){goVideo(vid.getAttribute('data-vid'));return}
  var op=t.closest('[data-open]');
  if(op){openDetail(op.getAttribute('data-open'));return}
  var tk=t.closest('[data-ticket]');
  if(tk&&!t.closest('[data-act]')){showBigQR(tk.getAttribute('data-ticket'));return}
  var a=t.closest('[data-act]');
  if(!a||a.closest('#web'))return;
  var act=a.getAttribute('data-act'),host=a.closest('[data-id]'),id=host&&host.getAttribute('data-id'),e=id&&ALL[id];
  var tkid=a.getAttribute('data-tk')||(a.closest('[data-ticket]')&&a.closest('[data-ticket]').getAttribute('data-ticket'));
  switch(act){
    case 'showqr':showBigQR(tkid);break;
    case 'addcal':addCal(tkid);break;
    case 'scan':scanTicket();break;
    case 'scango':scanGo();break;
    case 'install':doInstall();break;
    case 'upload':uploadSheet();break;
    case 'like':toggleLike(id);break;
    case 'save':toggleSave(id);break;
    case 'share':share(e||(tkid&&findTicket(tkid)&&findTicket(tkid).e));break;
    case 'buy':openWeb(e);break;
    case 'watch':closeSheet();goVideo(id);break;
    case 'similar':closeSheet();setChip(CHIPS.indexOf(e.type)>-1?e.type:'Tümü');S.q='';$('#q').value='';renderKesfet();setTab('kesfet');break;
    case 'restart':$('#feed').scrollTo({top:0,behavior:reduce?'auto':'smooth'});break;
    case 'editprofile':editProfile();break;
    case 'saveprofile':saveProfile();break;
    case 'editlikes':editLikes();break;
    case 'savelikes':var s=selectedPicks($('#lk-picks'));if(s.length){S.likes=s;persist();closeSheet();renderProfile();toast('Zevklerin güncellendi.')}break;
    case 'addcard':addCard();break;
    case 'savecard':saveCard();break;
    case 'defcard':var cid=a.closest('[data-card]').getAttribute('data-card');S.cards.forEach(function(c){c.def=(c.id===cid)});persist();renderProfile();toast('Varsayılan kart değişti.');break;
    case 'delcard':var did=a.closest('[data-card]').getAttribute('data-card');S.cards=S.cards.filter(function(c){return c.id!==did});if(S.cards.length&&!S.cards.some(function(c){return c.def}))S.cards[0].def=true;persist();renderProfile();toast('Kart silindi.');break;
    case 'theme':S.theme=a.getAttribute('data-v');applyTheme();persist();renderProfile();break;
    case 'logout':
      $('#main').hidden=true;$('#onb').hidden=false;setTab('kesfet');$('#main').hidden=true;
      S.name='';S.email='';S.phone='';S.loggedIn=false;
      try{localStorage.removeItem(STORE)}catch(x){}
      $('#in-name').value='';$('#in-mail').value='';
      showStep(1);break;
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if(!$('#web').hidden)closeWeb();else if(!$('#sheet').hidden)closeSheet();
});

/* ---------- paylaşılan bağlantı (?bilet=KOD) ---------- */
function openSharedTicket(){
  var m=/(?:^|[?&])bilet=([^&]+)/.exec(location.search);
  if(!m)return false;
  var t=findTicket(decodeURIComponent(m[1]));
  if(!t){toast('Bu bağlantıdaki bilet bulunamadı.');return false}
  setTab('biletler');showBigQR(t.id);return true;
}

/* ---------- uygulama kısayolları ve derin bağlantılar ---------- */
var pendingShortcut=null;
function firstMissingEvent(){
  return EVENTS.filter(function(e){return !S.tickets.some(function(t){return t.e.id===e.id})}).sort(function(a,b){return kmTo(a)-kmTo(b)})[0]||EVENTS[0];
}
function runShortcut(git){
  if(git==='videolar'){setTab('videolar');return}
  if(git==='profil'){setTab('profil');return}
  if(git==='biletlerim'){setTab('biletler');return}
  if(git==='yakin'){setTab('kesfet');if(!S.locOn)geoAsk();return}
  if(git==='ara'){setTab('kesfet');setTimeout(function(){var q=$('#q');if(q)q.focus()},120);return}
  if(git==='bilet-al'){var e=firstMissingEvent();if(e)openWeb(e);return}
  setTab('kesfet');
}
function applyDeepLink(){
  var m=/[?&]git=([^&]+)/.exec(location.search);
  if(m){
    pendingShortcut=decodeURIComponent(m[1]);
    /* Kısayol bir kez çalışsın; adres çubuğunda kalırsa yenilemede tekrar tetiklenir. */
    try{
      var u=new URL(location.href);u.searchParams.delete('git');
      history.replaceState(history.state,'',u.pathname+(u.search||'')+u.hash);
    }catch(e){}
    if(S.loggedIn){runShortcut(pendingShortcut);pendingShortcut=null;return true}
  }
  return false;
}

/* ---------- çevrimdışı destek ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}

function renderAll(){renderKesfet();renderTickets();renderProfile()}
restore();applyTheme();renderChips();
if(S.loggedIn){$('#onb').hidden=true;$('#main').hidden=false;renderAll();setTab('kesfet');applyDeepLink();openSharedTicket()}
else{applyDeepLink();showStep(1)}
})();
</script>
