name: Yayın (Cloudflare Pages)

# Siteyi Cloudflare Pages'e yükler. master dalına her push'ta çalışır.
# Sırlar tanımlanana kadar sessizce atlanır (kırmızı çarpı oluşturmaz).
#
# Gerekli sırlar (depo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Pages:Edit yetkili API anahtarı
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimliği

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sır denetimi
        id: check
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare sırları tanımlı değil; yayın atlandı."
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Depoyu al
        if: steps.check.outputs.hazir == 'true'
        uses: actions/checkout@v4

      - name: Yayın paketini hazırla
        if: steps.check.outputs.hazir == 'true'
        run: bash tools/build_site.sh

      - name: Cloudflare Pages'e yükle
        if: steps.check.outputs.hazir == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=genc --branch=master
