name: Yayın (Surge + Cloudflare Pages)

# master'a her push'ta siteyi yayınlar.
#   - Surge (genc.surge.sh)   → ASIL adres
#   - Cloudflare Pages (genc.pages.dev) → yedek
# İlgili sırlar tanımlı değilse o iş sessizce atlanır.

on:
  push:
    branches: [master]
  # Veri yenileme işi bot token'ıyla commit attığı için push tetiklemesi
  # çalışmaz; veri yenileme bittiğinde yayını bu olay tetikler.
  workflow_run:
    workflows: ["Veri yenileme"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  surge:
    name: Surge (genc.surge.sh)
    runs-on: ubuntu-latest
    env:
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
    steps:
      - name: Sır denetimi
        id: check
        run: |
          if [ -z "$SURGE_TOKEN" ] || [ -z "$SURGE_LOGIN" ]; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "Surge sırları tanımlı değil; yayın atlandı."
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Depoyu al
        if: steps.check.outputs.hazir == 'true'
        uses: actions/checkout@v4
      - name: Node kur
        if: steps.check.outputs.hazir == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Surge'e yükle
        if: steps.check.outputs.hazir == 'true'
        run: bash tools/deploy_surge.sh

  cloudflare:
    name: Cloudflare Pages (genc.pages.dev)
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sır denetimi
        id: check
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare sırları tanımlı değil; yayın atlandı."
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Depoyu al
        if: steps.check.outputs.hazir == 'true'
        uses: actions/checkout@v4
      - name: Yayın paketini hazırla
        if: steps.check.outputs.hazir == 'true'
        run: bash tools/build_site.sh
      - name: Cloudflare Pages'e yükle
        if: steps.check.outputs.hazir == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=genc --branch=master
