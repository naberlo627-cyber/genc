name: Veri yenileme

# Genç uygulamasının etkinlik verisini her gün yeniden toplar ve yayına alır.
# Tek işi budur: kaynakları tarar, veriyi günceller, değişiklikleri işler.
#
# GitHub Actions seçildi çünkü ayrı bir sunucu gerektirmez, çökmez ve ücretsizdir;
# zamanlanmış işler GitHub altyapısında çalışır. Veri değişmezse işlem yapılmaz.
#
# Gerekli ayar: repo Ayarlar → Actions → Workflow permissions → "Read and write".
# (Bu izin kurulum sırasında bir kez verilir; sonrası otomatiktir.)

on:
  schedule:
    # Günde iki kez: 01:30 UTC (04:30 TRT) ve 13:30 UTC (16:30 TRT).
    # Tek seferlik gece çalışması yeni etkinlikleri bir gün geciktiriyordu;
    # öğleden sonraki tur aynı gün yayına alınmalarını sağlar.
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}   # elle tetikleme (Actions sekmesinden "Run workflow")

# Aynı anda iki yenileme çalışmasın.
concurrency:
  group: veri-yenileme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Veriyi yenile
        run: ./refresh/run.sh

      - name: Değişiklikleri işle
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok; işlem yapılmadı."
            exit 0
          fi
          git config user.name "genc-veri-bot"
          git config user.email "genc-veri-bot@users.noreply.github.com"
          git add -A
          MESAJ="Veri yenileme: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$MESAJ" \
            -m "Otomatik günlük etkinlik verisi güncellemesi." \
            -m "Co-authored-by: openhands <openhands@all-hands.dev>"
          git push

      - name: Sonucu özetle
        if: always()
        run: |
          echo "### Veri yenileme sonucu" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/refresh_status.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/refresh_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/kaynak_durumu.json ]; then
            echo "### Kaynak sağlığı" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/kaynak_durumu.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
